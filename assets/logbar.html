<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- 'unsafe-inline' is required: the logic is an inline <script>, and
     script-src 'self' alone makes Chromium drop it silently — the panel would
     render but never update. See the longer note in panel.html. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline';" />
<title>日志面板</title>
<style>
  :root {
    --bg: #161920;
    --bg-2: #1a1d26;
    --border: #272b36;
    --fg: #d6dae3;
    --dim: #8b93a7;
    --accent: #4c8dff;
    --err: #ff6b6b;
    --warn: #ffb454;
    /* Type scale — see panel.html. The log bar tracks the same tokens so the
       面板字号 setting resizes it together with every other shell surface. */
    --fs-scale: 1;
    --fs-base: calc(13.5px * var(--fs-scale));
    --fs-md: calc(13px * var(--fs-scale));
    --fs-sm: calc(12px * var(--fs-scale));
    --font-ui: "Segoe UI", "Microsoft YaHei", sans-serif;
    --font-mono: Consolas, "Cascadia Mono", "Courier New", monospace;
    /* Alias so the resizer gradient can use the same token name as the
       panel/sidebar handles (this page historically calls the value --dim). */
    --fg-dim: var(--dim);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); font-size: var(--fs-md); line-height: 1.45;
    display: flex; flex-direction: column;
    border-top: 1px solid var(--border);
    user-select: none;
  }

  /* Top-edge drag handle (log bar height), same visual contract as the
     panel/sidebar handles: a ≥2px high-contrast line inside the 6px strip,
     accent on hover. Same stop order as panel.html so the line reads the
     same way. */
  #resizer {
    height: 6px; cursor: ns-resize; flex: none;
    background: linear-gradient(to bottom,
      transparent 0, transparent 4px,
      var(--fg-dim) 4px, var(--fg-dim) 6px);
    box-shadow: 0 0 6px rgba(76, 141, 255, 0.22);
  }
  #resizer:hover, #resizer.dragging {
    background: var(--accent);
    box-shadow: 0 0 10px rgba(76, 141, 255, 0.45);
  }

  header {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; background: var(--bg-2);
  }
  header .title { font-weight: 600; margin-right: 2px; }
  header .spacer { flex: 1; }
  header .hint { color: var(--dim); font-size: var(--fs-sm); }
  .chip {
    background: #22262f; color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; padding: 1px 10px; cursor: pointer;
  }
  .chip.off { opacity: .38; text-decoration: line-through; }

  /* Form controls do NOT inherit font-family/size from body in Chromium, so
     every one of them restates the tokens. Omitting it leaves 13px labels next
     to an 11px default control — the exact mismatch the type scale exists to
     prevent. */
  button, input {
    font-family: var(--font-ui); font-size: var(--fs-md); line-height: 1.5;
    color: var(--fg); background: #22262f;
    border: 1px solid var(--border); border-radius: 3px;
  }
  button { cursor: pointer; padding: 1px 8px; }
  button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=checkbox] { width: auto; padding: 0; }
  label.chk { display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: var(--fs-sm); }

  #no-bridge {
    display: none; padding: 10px 14px; color: var(--warn);
  }
  #lines {
    flex: 1; overflow-y: auto; padding: 4px 8px 8px;
    font-family: var(--font-mono); font-size: var(--fs-sm); line-height: 1.5;
    user-select: text; cursor: text;
  }
  #lines .empty { color: var(--dim); font-family: var(--font-ui); }
  .row { white-space: pre-wrap; word-break: break-all; }
  .row .t { color: var(--dim); }
  .row .src { color: var(--accent); }
  .row.err .text { color: var(--err); }
  .row.fatal .src { color: var(--err); font-weight: 600; }
  /* Clickable file paths inside a row (panel 运行监控 capability moved here). */
  a.path { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); cursor: pointer; }
  a.path:hover { background: rgba(76,141,255,.15); }
  /* Path context menu (same shape as the panel's old one). */
  #path-menu {
    position: fixed; display: none; z-index: 50; background: #22262f;
    border: 1px solid var(--border); border-radius: 4px; padding: 3px;
    box-shadow: 0 6px 20px rgba(0,0,0,.5); min-width: 210px;
  }
  #path-menu .path-text {
    padding: 5px 9px; font-size: var(--fs-sm); color: var(--dim);
    border-bottom: 1px solid var(--border); margin-bottom: 3px;
    word-break: break-all; user-select: text;
  }
  #path-menu button {
    display: block; width: 100%; text-align: left; border: none; background: none;
    color: var(--fg); padding: 4px 8px; border-radius: 3px;
    font-size: var(--fs-sm); font-family: var(--font-ui); cursor: pointer;
  }
  #path-menu button:hover { background: var(--accent); color: #fff; }
</style>
</head>
<body>
  <div id="resizer" title="拖动调整日志面板高度"></div>
  <header>
    <span class="title">日志</span>
    <span id="chips"></span>
    <span class="spacer"></span>
    <label class="chk"><input type="checkbox" id="chk-autoscroll" checked />自动滚动</label>
    <button id="btn-clear" title="清空当前视图（不影响日志文件）">清空</button>
    <button id="btn-dir" title="在文件管理器中打开日志文件夹">打开日志目录</button>
  </header>
  <div id="no-bridge">
    日志面板不可用（preload 未加载）。完整日志在
    %APPDATA%\deepseek-studio\logs\，可通过菜单「视图 → 打开日志文件夹」直达。
  </div>
  <div id="lines"><div class="empty">加载中…</div></div>
  <div id="path-menu">
    <div class="path-text"></div>
    <button data-act="edit">用外部编辑器打开</button>
    <button data-act="reveal">在文件管理器中显示</button>
    <button data-act="copy">复制路径</button>
  </div>

<script>
(function () {
  'use strict';
  var api = window.dshLogs;
  if (!api) {
    document.getElementById('no-bridge').style.display = 'block';
    document.getElementById('lines').textContent = '';
    return;
  }

  var MAX_KEPT = 2000; // client-side ceiling; the main process caps each batch too
  var entries = [];    // everything received, oldest first
  var active = null;   // null = all sources; otherwise a Set of source ids
  var labels = {};     // source id -> Chinese label

  var linesEl = document.getElementById('lines');
  var chipsEl = document.getElementById('chips');
  var autoscroll = document.getElementById('chk-autoscroll');

  function fmtTime(ts) {
    var d = new Date(ts);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function rowFor(e) {
    var row = document.createElement('div');
    row.className = 'row' + (e.stream === 'err' ? ' err' : '') + (e.source === 'fatal' ? ' fatal' : '');
    var t = document.createElement('span');
    t.className = 't';
    t.textContent = fmtTime(e.ts) + ' ';
    var src = document.createElement('span');
    src.className = 'src';
    src.textContent = '[' + (labels[e.source] || e.source) + '] ';
    var text = document.createElement('span');
    text.className = 'text';
    renderText(text, e.text);
    row.appendChild(t);
    row.appendChild(src);
    row.appendChild(text);
    return row;
  }

  // ── clickable file paths ─────────────────────────────────────────────
  // Hits are computed per batch in the main process (sandboxed preload) and
  // cached by exact text; a cache miss renders plain text, and the batch
  // result triggers one cheap re-render.

  var pathCache = {};   // line text -> hits[{index,length,text}]
  var pathPending = {}; // texts already requested

  function renderText(el, text) {
    var hits = pathCache[text];
    if (!hits || !hits.length) { el.textContent = text; return; }
    var pos = 0;
    for (var i = 0; i < hits.length; i++) {
      var h = hits[i];
      if (h.index > pos) el.appendChild(document.createTextNode(text.slice(pos, h.index)));
      var a = document.createElement('a');
      a.className = 'path';
      a.textContent = h.text;
      a.title = '点击选择操作';
      a.dataset.path = h.text;
      el.appendChild(a);
      pos = h.index + h.length;
    }
    if (pos < text.length) el.appendChild(document.createTextNode(text.slice(pos)));
  }

  function requestPaths(entries) {
    if (!api.findPathsBatch) return;
    var unseen = [];
    for (var i = 0; i < entries.length; i++) {
      var txt = entries[i].text;
      if (txt && !(txt in pathCache) && !(txt in pathPending)) unseen.push(txt);
    }
    if (!unseen.length) return;
    for (var j = 0; j < unseen.length; j++) pathPending[unseen[j]] = true;
    api.findPathsBatch(unseen).then(function (results) {
      for (var k = 0; k < unseen.length; k++) {
        pathCache[unseen[k]] = (results && results[k]) || [];
        delete pathPending[unseen[k]];
      }
      scheduleRender();
    }).catch(function () {
      for (var k = 0; k < unseen.length; k++) {
        pathCache[unseen[k]] = [];
        delete pathPending[unseen[k]];
      }
    });
  }

  function visible() {
    if (!active) return entries;
    return entries.filter(function (e) { return active.indexOf(e.source) >= 0; });
  }

  var renderScheduled = false;
  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    // One frame for a whole batch: a chatty backend must not lay out per line.
    requestAnimationFrame(function () {
      renderScheduled = false;
      var stick = autoscroll.checked &&
        (linesEl.scrollTop + linesEl.clientHeight >= linesEl.scrollHeight - 24);
      var view = visible();
      var frag = document.createDocumentFragment();
      if (!view.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = entries.length ? '当前筛选下没有日志' : '暂无日志输出';
        frag.appendChild(empty);
      } else {
        for (var i = 0; i < view.length; i++) frag.appendChild(rowFor(view[i]));
      }
      linesEl.textContent = '';
      linesEl.appendChild(frag);
      if (stick) linesEl.scrollTop = linesEl.scrollHeight;
    });
  }

  function absorb(list) {
    if (!list || !list.length) return;
    for (var i = 0; i < list.length; i++) entries.push(list[i]);
    if (entries.length > MAX_KEPT) entries.splice(0, entries.length - MAX_KEPT);
    requestPaths(list);
    scheduleRender();
  }

  function buildChips(sources) {
    chipsEl.textContent = '';
    for (var i = 0; i < sources.length; i++) {
      (function (id, label) {
        labels[id] = label;
        var chip = document.createElement('button');
        chip.className = 'chip';
        chip.textContent = label;
        chip.title = '点击显示/隐藏该来源';
        chip.onclick = function () {
          if (!active) {
            // First interaction: start from "everything" so toggling one
            // source hides only that one, rather than showing only it.
            active = sources.map(function (s) { return s.id; });
          }
          var at = active.indexOf(id);
          if (at >= 0) active.splice(at, 1); else active.push(id);
          chip.className = 'chip' + (active.indexOf(id) < 0 ? ' off' : '');
          scheduleRender();
        };
        chipsEl.appendChild(chip);
      })(sources[i].id, sources[i].label);
    }
  }

  api.snapshot().then(function (snap) {
    if (snap && snap.sources) buildChips(snap.sources);
    absorb(snap ? snap.entries : []);
  }).catch(function () {
    linesEl.textContent = '';
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '无法读取日志快照';
    linesEl.appendChild(empty);
  });

  api.onLines(absorb);

  document.getElementById('btn-dir').onclick = function () {
    api.revealLogDir();
  };
  autoscroll.onchange = function () {
    if (autoscroll.checked) linesEl.scrollTop = linesEl.scrollHeight;
  };

  document.getElementById('btn-clear').onclick = function () {
    entries.length = 0;
    scheduleRender();
  };

  // ── path context menu (clickable file paths in rows) ───────────────────

  var menuEl = document.getElementById('path-menu');
  var menuTextEl = menuEl.querySelector('.path-text');
  var currentPath = '';

  linesEl.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a.path') : null;
    if (!a) return;
    e.preventDefault();
    currentPath = a.dataset.path || a.textContent;
    menuTextEl.textContent = currentPath;
    menuEl.style.display = 'block';
    var r = a.getBoundingClientRect();
    var top = Math.min(r.bottom + 2, window.innerHeight - menuEl.offsetHeight - 4);
    menuEl.style.top = Math.max(4, top) + 'px';
    menuEl.style.left = Math.max(4, Math.min(r.left, window.innerWidth - menuEl.offsetWidth - 4)) + 'px';
  });

  document.addEventListener('click', function (e) {
    if (menuEl.style.display === 'block' && !menuEl.contains(e.target)) {
      menuEl.style.display = 'none';
    }
  });

  menuEl.addEventListener('click', function (e) {
    var act = e.target && e.target.dataset ? e.target.dataset.act : null;
    if (!act) return;
    menuEl.style.display = 'none';
    if (act === 'copy') {
      navigator.clipboard.writeText(currentPath).then(
        function () { toast('已复制路径'); },
        function () { toast('复制失败', true); }
      );
    } else if (act === 'edit') {
      api.openInEditor(currentPath).then(function (r) {
        if (r && !r.ok) toast('打开失败：' + (r.error || '未知错误'), true);
      });
    } else if (act === 'reveal') {
      api.revealPath(currentPath).then(function (r) {
        if (r && !r.ok) toast('无法显示：' + (r.error || '未知错误'), true);
      });
    }
  });

  // ── top-edge resizer (log bar height, handled by the main process) ──────
  // Same delta pattern as panel.html's width handle: report the desired TOTAL
  // height, the main process clamps (LOGBAR_MIN/MAX) and relayouts.
  if (api.setHeight) {
    var resizer = document.getElementById('resizer');
    resizer.addEventListener('mousedown', function (e) {
      e.preventDefault();
      resizer.classList.add('dragging');
      var startY = e.clientY;

      function onMove(ev) {
        // Dragging up grows the bar; report the desired total height.
        api.setHeight(window.innerHeight + (startY - ev.clientY));
      }
      function onUp() {
        resizer.classList.remove('dragging');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }
})();
</script>
</body>
</html>
