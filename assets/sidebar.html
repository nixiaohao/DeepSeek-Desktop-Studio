<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!--
  Same CSP reasoning as panel.html: `default-src 'none'` blocks every remote
  load, and the inline <script> needs 'unsafe-inline'. The isolation boundary
  is the preload + contextIsolation, not this header.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline';" />
<title>文件</title>
<style>
  :root {
    --bg: #14161d;
    --bg-2: #1a1d26;
    --bg-3: #1f232d;
    --border: #272b36;
    --fg: #d6dae3;
    --fg-dim: #8b93a7;
    --accent: #4c8dff;
    --err: #ff6b6b;
    --ok: #3ddc84;
    --warn: #ffb454;
    --font: 12px/1.5 "Cascadia Mono", "Consolas", "Microsoft YaHei Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg); font: var(--font);
    display: flex; flex-direction: row; user-select: none;
  }

  /* Right-edge drag handle → resizes the sidebar via the main process.
     A 2px line on the right side of the resizer is always visible: without
     it the seam between the sidebar and the dsh page reads as a dead gap
     (the user reported the same problem with the right monitor panel), and
     a 1px line in var(--border) (#272b36) on the dsh dark background had a
     brightness contrast of only ~9% — practically invisible. The full strip
     goes accent on hover/drag. */
  #resizer {
    width: 6px; cursor: ew-resize; flex: none; margin-left: auto;
    background: linear-gradient(to right,
      transparent 0, transparent 4px,
      var(--fg-dim) 4px, var(--fg-dim) 6px);
    box-shadow: 0 0 6px rgba(76, 141, 255, 0.22);
  }
  #resizer:hover, #resizer.dragging {
    background: var(--accent);
    box-shadow: 0 0 10px rgba(76, 141, 255, 0.45);
  }

  #app { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  header {
    flex: none; height: 26px; display: flex; align-items: center; gap: 6px;
    padding: 0 6px; background: var(--bg-2); border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--fg-dim); white-space: nowrap;
  }
  header .title {
    color: var(--fg); font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; flex: 1; min-width: 0;
  }
  button {
    background: #22262f; color: var(--fg); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 6px; font: var(--font); font-size: 11px;
    cursor: pointer; flex: none;
  }
  button:hover { border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  /* ── git strip ── */
  #git {
    flex: none; padding: 5px 7px; background: var(--bg-2);
    border-bottom: 1px solid var(--border); font-size: 11px; color: var(--fg-dim);
  }
  #git .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #branch {
    color: var(--fg); background: var(--bg-3); border: 1px solid var(--border);
    border-radius: 9px; padding: 0 7px; font-size: 10px;
  }
  #counts span { margin-right: 7px; }
  #counts .staged { color: var(--ok); }
  #counts .unstaged { color: var(--warn); }
  #counts .untracked { color: var(--accent); }
  #counts .conflicted { color: var(--err); }
  .note { margin-top: 4px; font-size: 10px; line-height: 1.45; white-space: normal; }
  .note.warn { color: var(--warn); }
  .note.err { color: var(--err); }

  /* ── changed files ── */
  #changedWrap { flex: none; max-height: 34%; display: flex; flex-direction: column; min-height: 0; }
  #changed { overflow: auto; padding: 3px 0; }
  .sec-title {
    padding: 3px 7px; font-size: 10px; color: var(--fg-dim);
    background: var(--bg-2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .file {
    display: flex; align-items: center; gap: 5px; padding: 1px 7px;
    cursor: pointer; white-space: nowrap; font-size: 11px;
    user-select: text;
  }
  .file:hover { background: var(--bg-3); }
  .file.on { background: rgba(76,141,255,.16); }
  .file .b { flex: none; width: 12px; text-align: center; font-weight: 700; }
  .file .n { overflow: hidden; text-overflow: ellipsis; }
  .file .d { color: var(--fg-dim); font-size: 10px; overflow: hidden; text-overflow: ellipsis; }
  .b.M, .b.\! { color: var(--warn); }
  .b.\? { color: var(--accent); }
  .b.\● { color: var(--ok); }

  /* ── diff ── */
  #diffWrap { flex: 1 1 40%; display: none; flex-direction: column; min-height: 0; border-top: 1px solid var(--border); }
  #diffWrap.on { display: flex; }
  #diff {
    flex: 1; overflow: auto; padding: 5px 7px; font-size: 11px;
    white-space: pre; user-select: text; color: var(--fg-dim);
  }
  #diff .add { color: var(--ok); }
  #diff .del { color: var(--err); }
  #diff .hunk { color: var(--accent); }

  /* ── syntax tokens ──────────────────────────────────────────────────
     Classes emitted by src/highlight.ts (see panel.html for why classes and
     not inline styles). Coloured tokens override the .add/.del line colour,
     which is the point: on a big diff, "which word is a string" carries more
     than "this whole line is green". */
  .tok-k { color: #569cd6; }
  .tok-s { color: #ce9178; }
  .tok-c { color: #6a9955; }
  .tok-n { color: #b5cea8; }
  .tok-a { color: #9cdcfe; }

  /* ── tree ── */
  #treeWrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--border); }
  #tree { flex: 1; overflow: auto; padding: 3px 0; }
  #tree .row {
    display: flex; align-items: center; gap: 4px; padding: 1px 5px;
    cursor: pointer; white-space: nowrap; font-size: 11px;
  }
  #tree .row:hover { background: var(--bg-3); }
  #tree .tri { flex: none; width: 11px; text-align: center; color: var(--fg-dim); font-size: 9px; }
  #tree .ic { flex: none; width: 13px; text-align: center; opacity: .8; }
  #tree .nm { overflow: hidden; text-overflow: ellipsis; }
  #tree .bg { flex: none; margin-left: 4px; font-weight: 700; font-size: 10px; }
  #tree .bg.M, #tree .bg.\! { color: var(--warn); }
  #tree .bg.\? { color: var(--accent); }
  #tree .bg.\● { color: var(--ok); }
  #tree .dir { color: var(--accent); }
  #tree .row.dirty .nm { color: var(--warn); }

  .empty { padding: 10px 8px; color: var(--fg-dim); font-size: 11px; line-height: 1.6; }
  .empty code { color: var(--fg); font-size: 10px; }

  /* ── footer hints ── */
  #foot {
    flex: none; padding: 3px 7px; font-size: 10px; color: var(--fg-dim);
    background: var(--bg-2); border-top: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #foot.warn { color: var(--warn); }

  /* ── toast + context menu ── */
  #toast {
    position: fixed; left: 6px; bottom: 6px; right: 10px; padding: 4px 7px;
    background: #2a2f3b; border: 1px solid var(--border); border-radius: 3px;
    font-size: 10px; color: var(--fg); display: none; z-index: 20;
  }
  #toast.err { border-color: var(--err); color: var(--err); }
  #menu {
    position: fixed; display: none; z-index: 30; background: #22262f;
    border: 1px solid var(--border); border-radius: 3px; padding: 2px; min-width: 130px;
  }
  #menu div { padding: 3px 9px; font-size: 11px; cursor: pointer; }
  #menu div:hover { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title" id="rootName">文件</span>
    <button id="btn-refresh" title="重新读取目录与 git 状态">⟳</button>
    <button id="btn-collapse" title="全部折叠">⌄</button>
    <button id="btn-pick" title="选择目录…">…</button>
  </header>

  <div id="git">
    <div class="row">
      <span id="branch" style="display:none"></span>
      <span id="counts"></span>
    </div>
    <div id="gitNotes"></div>
  </div>

  <div id="changedWrap" style="display:none">
    <div class="sec-title"><span>改动</span><span id="changedCount" style="opacity:.7"></span></div>
    <div id="changed"></div>
  </div>

  <div id="diffWrap">
    <div class="sec-title">
      <span id="diffName">改动内容</span>
      <span style="flex:1"></span>
      <button id="btn-diff-close" title="关闭">×</button>
    </div>
    <div id="diff"></div>
  </div>

  <div id="treeWrap">
    <div class="sec-title"><span>目录</span></div>
    <div id="tree"></div>
  </div>

  <div id="foot" style="display:none"></div>
</div>
<div id="resizer" title="拖动调整宽度"></div>
<div id="toast"></div>
<div id="menu"></div>

<script>
(function () {
  var api = window.dshSidebar;
  if (!api) {
    document.getElementById('tree').innerHTML =
      '<div class="empty">侧栏桥接不可用（preload 未加载）。<br><br>' +
      '主进程已把真实原因写入日志：<br>' +
      '<code>%APPDATA%\\deepseek-studio\\logs\\launcher.log</code><br><br>' +
      '搜索 <code>preload-error</code> 或 <code>renderer-gone</code>。</div>';
    return;
  }

  var $ = function (id) { return document.getElementById(id); };
  var rootNameEl = $('rootName');
  var treeEl = $('tree');
  var changedEl = $('changed');
  var changedWrap = $('changedWrap');
  var diffWrap = $('diffWrap');
  var diffEl = $('diff');
  var footEl = $('foot');
  var toastEl = $('toast');
  var menuEl = $('menu');

  var selected = '';   // path whose diff is on screen
  var repaintTimer = null;
  var toastTimer = null;
  var menuTarget = '';

  // ── helpers ──────────────────────────────────────────────────────────

  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.className = isErr ? 'err' : '';
    toastEl.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.style.display = 'none'; }, 4000);
  }

  /** Last one or two path segments, so a deep path still reads as something. */
  function shortName(p) {
    if (!p) return '';
    var parts = p.replace(/\\/g, '/').split('/').filter(Boolean);
    if (parts.length <= 2) return parts.join('/');
    return parts.slice(-2).join('/');
  }

  /**
   * Escape for TEXT and for double-quoted ATTRIBUTES.
   *
   * The quote matters: every value escaped here ends up in `data-p="…"` or
   * `title="…"`, and a stray `"` would close the attribute early. Windows
   * filenames cannot contain one today, but a path arriving from git or from a
   * session list is not guaranteed to be a Windows filename, and the cost of
   * escaping is three characters.
   */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function report(result, okMsg) {
    if (result && result.ok === false) toast(result.error || '操作失败', true);
    else if (okMsg) toast(okMsg);
  }

  // ── git strip ────────────────────────────────────────────────────────

  function renderGit(git) {
    var branchEl = $('branch');
    if (git.isRepo && git.branch) {
      branchEl.textContent = git.branch;
      branchEl.style.display = '';
    } else {
      branchEl.style.display = 'none';
    }

    var s = git.summary || {};
    var bits = [];
    if (s.staged) bits.push('<span class="staged">● ' + s.staged + ' 已暂存</span>');
    if (s.unstaged) bits.push('<span class="unstaged">M ' + s.unstaged + ' 未暂存</span>');
    if (s.untracked) bits.push('<span class="untracked">? ' + s.untracked + ' 未跟踪</span>');
    if (s.conflicted) bits.push('<span class="conflicted">! ' + s.conflicted + ' 冲突</span>');
    if (!bits.length && git.isRepo) bits.push('<span>工作区干净</span>');
    if (!bits.length && !git.isRepo) bits.push('<span>不是 git 仓库</span>');
    $('counts').innerHTML = bits.join('');

    var notes = $('gitNotes');
    var out = '';
    if (git.error) out += '<div class="note err">' + esc(git.error) + '</div>';
    if (git.writeLocked) {
      out += '<div class="note warn">此目录由自动更新管理，侧栏只读取、不写入；' +
             '在此做的改动会在下次更新时被覆盖。</div>';
    }
    notes.innerHTML = out;
  }

  // ── changed files ────────────────────────────────────────────────────

  function renderChanged(git) {
    var files = (git && git.files) || [];
    if (!files.length) {
      changedWrap.style.display = 'none';
      return;
    }
    changedWrap.style.display = '';
    $('changedCount').textContent = files.length + ' 个文件';
    var html = '';
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      var dir = f.path.replace(/\\/g, '/').replace(/\/[^/]*$/, '');
      html +=
        '<div class="file' + (f.path === selected ? ' on' : '') + '" data-p="' + esc(f.path) + '">' +
        '<span class="b">' + esc(f.conflicted ? '!' : f.untracked ? '?' : f.staged && f.unstaged ? 'M' : f.staged ? '●' : 'M') + '</span>' +
        '<span class="n">' + esc(f.path.replace(/\\/g, '/').split('/').pop()) + '</span>' +
        (dir ? '<span class="d">' + esc(dir) + '</span>' : '') +
        '</div>';
    }
    changedEl.innerHTML = html;
  }

  // ── tree ─────────────────────────────────────────────────────────────

  function renderTree(rows) {
    if (!rows.length) {
      treeEl.innerHTML = '<div class="empty">这个目录是空的。</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var tri = r.expandable ? (r.expanded ? '▾' : '▸') : '';
      var ic = r.isDir ? '▣' : '·';
      html +=
        '<div class="row' + (r.badge ? ' dirty' : '') + '" data-p="' + esc(r.path) + '"' +
        ' data-dir="' + (r.isDir ? '1' : '0') + '" title="' + esc(r.path + (r.status ? ' — ' + r.status : '')) + '">' +
        '<span style="flex:none;width:' + (r.depth * 11) + 'px"></span>' +
        '<span class="tri">' + tri + '</span>' +
        '<span class="ic' + (r.isDir ? ' dir' : '') + '">' + ic + '</span>' +
        '<span class="nm">' + esc(r.name) + '</span>' +
        (r.badge ? '<span class="bg">' + esc(r.badge) + '</span>' : '') +
        '</div>';
    }
    treeEl.innerHTML = html;
  }

  // ── footer ───────────────────────────────────────────────────────────

  function renderFoot(snap) {
    var msgs = [];
    var warn = false;
    if (snap.truncated) {
      msgs.push('目录过大，只显示前 ' + snap.rows.length + ' 项');
      warn = true;
    }
    if (snap.errors && snap.errors.length) {
      msgs.push(snap.errors.length + ' 个子目录无法读取');
      warn = true;
    }
    if (!msgs.length) {
      footEl.style.display = 'none';
      return;
    }
    footEl.style.display = '';
    footEl.className = warn ? 'warn' : '';
    footEl.textContent = msgs.join('　·　');
  }

  // ── diff ─────────────────────────────────────────────────────────────

  /**
   * Highlight a fragment, degrading to escaped plain text.
   *
   * Same reasoning as panel.html's hl(): `api` comes from the preload, and a
   * throw inside a render loop shows the user an empty diff with no clue.
   */
  function hl(code, filePath) {
    try {
      var out = api.highlight(code, filePath);
      if (typeof out === 'string' && out) return out;
    } catch (e) { /* bridge missing or older than this page */ }
    return esc(code);
  }

  function renderDiff(text) {
    if (!text) {
      diffEl.innerHTML = '<span style="opacity:.7">没有差异（可能是新文件，或改动已暂存）。</span>';
      return;
    }
    var lines = text.split('\n');
    var html = '';
    var run = [];
    var runCls = null;

    /**
     * Consecutive lines sharing one class are highlighted as ONE blob.
     *
     * Two reasons, both about correctness rather than speed:
     *  - a block comment or triple-quoted string that spans an added run is
     *    then coloured as a whole instead of being cut at every newline;
     *  - the newlines live INSIDE the .add/.del span, and in a <pre> they still
     *    break the line, so one span gives per-line colour without one span per
     *    line — and without splitting highlighted HTML back apart at newlines,
     *    which would mean re-opening every span the break cut through.
     */
    function flushRun() {
      if (!run.length) return;
      html += (runCls ? '<span class="' + runCls + '">' + hl(run.join('\n'), selected) + '</span>'
        : hl(run.join('\n'), selected)) + '\n';
      run = [];
    }

    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      var cls = '';
      if (l.charAt(0) === '+' && l.indexOf('+++') !== 0) cls = 'add';
      else if (l.charAt(0) === '-' && l.indexOf('---') !== 0) cls = 'del';
      else if (l.indexOf('@@') === 0) cls = 'hunk';
      if (cls !== runCls) { flushRun(); runCls = cls; }
      run.push(l);
    }
    flushRun();
    diffEl.innerHTML = html;
  }

  function showDiff(path) {
    selected = path;
    diffWrap.classList.add('on');
    $('diffName').textContent = shortName(path);
    diffEl.innerHTML = '<span style="opacity:.7">读取中…</span>';
    api.diff(path).then(function (r) {
      if (!r || !r.ok) {
        diffEl.innerHTML = '<span style="color:var(--err)">' + esc((r && r.error) || '读取失败') + '</span>';
        return;
      }
      renderDiff(r.text);
      if (r.truncated) {
        diffEl.innerHTML += '\n<span style="color:var(--warn)">… 差异过大，已截断。</span>';
      }
    }).catch(function (e) {
      diffEl.innerHTML = '<span style="color:var(--err)">' + esc(String(e && e.message || e)) + '</span>';
    });
    scheduleRepaint();
  }

  function hideDiff() {
    selected = '';
    diffWrap.classList.remove('on');
    scheduleRepaint();
  }

  // ── snapshot ─────────────────────────────────────────────────────────

  var lastSnap = null;

  function render(snap) {
    lastSnap = snap;
    rootNameEl.textContent = snap.root ? shortName(snap.root) : '未选择目录';
    rootNameEl.title = snap.root || '';
    renderGit(snap.git);
    renderChanged(snap.git);
    renderTree(snap.rows);
    renderFoot(snap);
  }

  function repaint() {
    api.snapshot().then(render).catch(function (e) {
      treeEl.innerHTML = '<div class="empty">读取失败：' + esc(String(e && e.message || e)) + '</div>';
    });
  }

  /**
   * Coalesce repaints. The mux stream bumps the revision many times a second
   * while an agent is working, and each repaint rebuilds the whole tree.
   */
  function scheduleRepaint() {
    if (repaintTimer) return;
    repaintTimer = setTimeout(function () {
      repaintTimer = null;
      repaint();
    }, 150);
  }

  // ── context menu ─────────────────────────────────────────────────────

  function openMenu(x, y, path, isDir) {
    menuTarget = path;
    var items = isDir
      ? [['在文件管理器中显示', 'reveal'], ['设为侧栏根目录', 'root']]
      : [['添加到 dsh 对话', 'addToChat'],
         ['在外部编辑器中打开', 'open'], ['查看改动', 'diff'],
         ['在文件管理器中显示', 'reveal'], ['复制路径', 'copy']];
    var html = '';
    for (var i = 0; i < items.length; i++) {
      html += '<div data-a="' + items[i][1] + '">' + items[i][0] + '</div>';
    }
    menuEl.innerHTML = html;
    menuEl.style.display = 'block';
    // Keep it on screen.
    var w = menuEl.offsetWidth, h = menuEl.offsetHeight;
    menuEl.style.left = Math.min(x, window.innerWidth - w - 4) + 'px';
    menuEl.style.top = Math.min(y, window.innerHeight - h - 4) + 'px';
  }

  function closeMenu() {
    menuEl.style.display = 'none';
    menuTarget = '';
  }

  menuEl.addEventListener('click', function (e) {
    var a = e.target && e.target.getAttribute && e.target.getAttribute('data-a');
    var p = menuTarget;
    closeMenu();
    if (!a || !p) return;
    if (a === 'open') api.openFile(p).then(function (r) { report(r); });
    else if (a === 'reveal') api.revealPath(p).then(function (r) { report(r); });
    else if (a === 'diff') showDiff(p);
    else if (a === 'copy') api.copyPath(p).then(function (r) { report(r, '已复制路径'); });
    else if (a === 'root') api.setRoot(p).then(function (r) { report(r); repaint(); });
    else if (a === 'addToChat') api.addToChat(p).then(function (r) {
      // The IPC returns the text the script actually wrote, so a confirmation
      // toast can show the user what was inserted — useful when the @-prefix
      // gets re-spaced by dsh's own input handling.
      if (r && r.ok) toast('已添加到 dsh 对话：' + (r.inserted || '@' + p));
      else report(r);
    });
  });

  document.addEventListener('mousedown', function (e) {
    if (menuEl.style.display === 'block' && !menuEl.contains(e.target)) closeMenu();
  });

  // ── events ───────────────────────────────────────────────────────────

  treeEl.addEventListener('click', function (e) {
    var row = e.target.closest ? e.target.closest('.row') : null;
    if (!row) return;
    var p = row.getAttribute('data-p');
    if (!p) return;
    if (row.getAttribute('data-dir') === '1') {
      api.toggleDir(p).then(function () { repaint(); });
    } else {
      api.openFile(p).then(function (r) { report(r); });
    }
  });

  treeEl.addEventListener('contextmenu', function (e) {
    var row = e.target.closest ? e.target.closest('.row') : null;
    if (!row) return;
    e.preventDefault();
    openMenu(e.clientX, e.clientY, row.getAttribute('data-p'), row.getAttribute('data-dir') === '1');
  });

  changedEl.addEventListener('click', function (e) {
    var row = e.target.closest ? e.target.closest('.file') : null;
    if (!row) return;
    var p = row.getAttribute('data-p');
    if (!p) return;
    if (p === selected) hideDiff();
    else showDiff(p);
  });

  changedEl.addEventListener('dblclick', function (e) {
    var row = e.target.closest ? e.target.closest('.file') : null;
    if (!row) return;
    api.openFile(row.getAttribute('data-p')).then(function (r) { report(r); });
  });

  $('btn-refresh').onclick = function () {
    api.refresh().then(function (r) { report(r); repaint(); });
  };
  $('btn-collapse').onclick = function () {
    api.collapseAll().then(function () { repaint(); });
  };
  $('btn-pick').onclick = function () {
    api.pickDir().then(function (dir) {
      if (!dir) return;
      api.setRoot(dir).then(function (r) { report(r); repaint(); });
    }).catch(function () { /* cancelled */ });
  };
  $('btn-diff-close').onclick = hideDiff;

  api.onUpdate(scheduleRepaint);

  // ── resizer ──────────────────────────────────────────────────────────

  var resizer = $('resizer');
  resizer.addEventListener('mousedown', function (e) {
    e.preventDefault();
    resizer.classList.add('dragging');
    var startX = e.clientX;
    var startW = window.innerWidth;
    function onMove(ev) { api.setWidth(startW + (ev.clientX - startX)); }
    function onUp() {
      resizer.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  repaint();
})();
</script>
</body>
</html>
