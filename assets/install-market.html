<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh;
    background: #0f1117;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex; flex-direction: column;
    align-items: center;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
    padding: 24px 28px;
  }
  .logo {
    width: 56px; height: 56px;
    margin-bottom: 14px;
  }
  .logo img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .title {
    font-size: 17px; font-weight: 600;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 12px; color: #64748b;
    margin-bottom: 18px;
  }
  .spinner {
    width: 22px; height: 22px;
    border: 2.5px solid rgba(99, 102, 241, 0.2);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .log {
    width: 100%;
    flex: 1;
    min-height: 0;
    background: #151a23;
    border: 1px solid #1e2532;
    border-radius: 8px;
    padding: 10px 12px;
    overflow-y: auto;
    font-size: 11.5px;
    line-height: 1.7;
    color: #94a3b8;
    -webkit-app-region: no-drag;
  }
  .log div { white-space: pre-wrap; word-break: break-all; }
  .log .active { color: #e2e8f0; }
  .status {
    margin-top: 12px;
    font-size: 12.5px; color: #94a3b8;
    min-height: 18px;
    text-align: center;
  }
  .status.ok { color: #34d399; }
  .status.err { color: #f87171; }
</style>
</head>
<body>
  <div class="logo"><img src="icon.png" alt="DeepSeek Studio"></div>
  <div class="title">安装插件市场</div>
  <div class="subtitle">dshmarket · 首次安装可能需要几分钟，请耐心等待</div>
  <div class="spinner"></div>
  <div class="log" id="log"></div>
  <div class="status" id="status">准备中...</div>
  <script>
    const { ipcRenderer } = require('electron');
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    let lastActive = null;

    ipcRenderer.on('plugin-market-progress', (_, msg) => {
      const line = document.createElement('div');
      line.textContent = msg || '';
      logEl.appendChild(line);
      // Keep the most recent line highlighted
      if (lastActive) lastActive.classList.remove('active');
      line.classList.add('active');
      lastActive = line;
      // Cap the log so a long install doesn't accumulate thousands of rows
      while (logEl.childElementCount > 60) logEl.removeChild(logEl.firstChild);
      logEl.scrollTop = logEl.scrollHeight;
      statusEl.textContent = msg || '';
    });

    ipcRenderer.on('plugin-market-done', (_, result) => {
      const ok = result && result.ok;
      statusEl.className = 'status ' + (ok ? 'ok' : 'err');
      statusEl.textContent = ok ? '安装成功' : '安装失败：' + ((result && result.error) || '未知错误');
    });
  </script>
</body>
</html>
