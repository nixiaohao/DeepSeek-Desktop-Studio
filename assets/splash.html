<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh;
    background: #0f1117;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }
  .logo {
    width: 72px; height: 72px;
    margin-bottom: 20px;
  }
  .logo img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .title {
    font-size: 20px; font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    font-size: 12px; color: #64748b;
    margin-bottom: 28px;
  }
  .status {
    font-size: 13px; color: #94a3b8;
    min-height: 20px;
    transition: opacity 0.3s;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2.5px solid rgba(99, 102, 241, 0.2);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .version {
    position: absolute; bottom: 12px;
    font-size: 11px; color: #475569;
  }
</style>
</head>
<body>
  <div class="logo"><img src="icon.png" alt="DeepSeek Studio"></div>
  <div class="title">DeepSeek Studio</div>
  <div class="subtitle">正在启动...</div>
  <div class="spinner"></div>
  <div class="status" id="status">初始化中...</div>
  <div class="version" id="version"></div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('progress', (_, msg) => {
      document.getElementById('status').textContent = msg;
    });
    ipcRenderer.on('version', (_, ver) => {
      document.getElementById('version').textContent = ver;
    });
  </script>
</body>
</html>
