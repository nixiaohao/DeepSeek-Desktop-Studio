<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!-- 'unsafe-inline' is required: the logic is an inline <script>, and
     script-src 'self' alone makes Chromium drop it silently — the status bar
     would render but never update. See the longer note in panel.html. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline';" />
<title>状态栏</title>
<style>
  :root {
    --bg: #1a1d26;
    --border: #272b36;
    --fg: #d6dae3;
    --dim: #8b93a7;
    --accent: #4c8dff;
    /* Type scale — see panel.html. The bar tracks --fs-md so it grows and
       shrinks with the rest of the shell instead of staying at the old 11px
       while everything around it was enlarged. */
    --fs-scale: 1;
    --fs-base: calc(13.5px * var(--fs-scale));
    --fs-md: calc(13px * var(--fs-scale));
    --fs-sm: calc(12px * var(--fs-scale));
    --font-sans: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-sans); font-size: var(--fs-md); line-height: 1.45;
    border-top: 1px solid var(--border);
    user-select: none;
  }
  #bar {
    height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 8px;
  }
  #dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none;
  }
  #phase { font-weight: 600; }
  #detail {
    color: var(--dim); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 45%;
  }
  .sep { width: 1px; height: 12px; background: var(--border); }
  .spacer { flex: 1; }
  #errors { color: var(--dim); }
  #meta { color: var(--dim); white-space: nowrap; }
  /* Aggregated agent stats (LLM/tool time, tokens, subagent count). Kept dim
     like #meta — it is readout, not alarm — and capped so a long line squeezes
     #detail instead of pushing the buttons off a narrow window. */
  #stats {
    color: var(--dim); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 38%;
  }
  button {
    background: #22262f; color: var(--fg); border: 1px solid var(--border);
    border-radius: 3px; padding: 2px 10px; font-size: var(--fs-md); cursor: pointer;
    font-family: var(--font-sans);
  }
  button:hover { border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  .c-starting { color: #4c8dff; }
  .c-ready    { color: #3ddc84; }
  .c-idle     { color: #8b93a7; }
  .c-degraded { color: #ffb454; }
  .c-exited   { color: #ff6b6b; }
  .c-error    { color: #ff6b6b; }
</style>
</head>
<body>
  <div id="bar">
    <span id="dot"></span>
    <span id="phase">启动中</span>
    <span class="sep"></span>
    <span id="detail"></span>
    <span class="spacer"></span>
    <span id="stats" title=""></span>
    <span class="sep" id="stats-sep" style="display:none"></span>
    <span id="cost" title="本地估算：价格表 × token 用量，不是账单（可在 ~/.dsh/model-prices.json 配置）"></span>
    <span id="errors"></span>
    <span class="sep"></span>
    <span id="meta"></span>
    <button id="btn-logs" title="打开日志文件夹">日志</button>
    <button id="btn-restart" title="仅重启后端服务">重启服务</button>
  </div>

<script>
(function () {
  'use strict';
  var api = window.dshPanel;
  if (!api) return;

  var dot = document.getElementById('dot');
  var phaseEl = document.getElementById('phase');
  var detailEl = document.getElementById('detail');
  var errorsEl = document.getElementById('errors');
  var metaEl = document.getElementById('meta');
  var restartBtn = document.getElementById('btn-restart');
  var logsBtn = document.getElementById('btn-logs');

  function label(phase) {
    try { return api.phaseLabel(phase) || phase; } catch (e) { return phase; }
  }

  function render(s) {
    if (!s) return;
    var c = 'c-' + s.phase;
    phaseEl.className = c;
    phaseEl.textContent = label(s.phase);
    dot.style.background = getComputedStyle(phaseEl).color;
    detailEl.textContent = s.detail || '';
    detailEl.title = s.detail || '';
    errorsEl.textContent = s.recentErrors > 0 ? ('错误 ' + s.recentErrors) : '';

    // Only offer a restart once something is actually wrong; a restart while
    // healthy would throw away a live session for no reason.
    var broken = s.phase === 'exited' || s.phase === 'error';
    restartBtn.style.display = broken ? '' : 'none';
  }

  api.getHealth().then(render).catch(function () {});
  api.onHealth(render);

  // Aggregated agent stats (main + subagents). The line is composed in
  // stats-model.ts (unit-tested) and arrives already formatted; '' means
  // "nothing to show" and hides the segment so the bar never shows zeros.
  var statsEl = document.getElementById('stats');
  var statsSep = document.getElementById('stats-sep');
  function renderStats(line) {
    var text = (typeof line === 'string') ? line : '';
    statsEl.textContent = text;
    statsEl.title = text;
    statsSep.style.display = text ? '' : 'none';
  }
  if (api.getStats) api.getStats().then(renderStats).catch(function () {});
  if (api.onStats) api.onStats(renderStats);

  // Cost segment: cache hit rate + estimated ¥ (price table × token usage).
  // Composed in stats-model.ts (unit-tested); '' hides the segment. The line
  // already carries the 估算 marker — it is an estimate, never a bill.
  var costEl = document.getElementById('cost');
  function renderCost(line) {
    var text = (typeof line === 'string') ? line : '';
    costEl.textContent = text;
    costEl.style.display = text ? '' : 'none';
  }
  costEl.style.display = 'none';
  if (api.getCost) api.getCost().then(renderCost).catch(function () {});
  if (api.onCost) api.onCost(renderCost);

  api.getStatusInfo().then(function (info) {
    if (!info) return;
    var parts = [];
    if (info.version) parts.push('dsh ' + info.version);
    if (info.port) parts.push(':' + info.port);
    if (info.channel) parts.push(info.channel);
    metaEl.textContent = parts.join('  ');
  }).catch(function () {});

  restartBtn.onclick = function () {
    restartBtn.disabled = true;
    restartBtn.textContent = '重启中…';
    api.restartBackend().then(function (r) {
      restartBtn.disabled = false;
      restartBtn.textContent = '重启服务';
      if (r && !r.ok) {
        detailEl.textContent = '重启失败：' + (r.error || '未知错误');
        detailEl.className = 'c-error';
      }
    });
  };

  logsBtn.onclick = function () { api.openLogs(); };
})();
</script>
</body>
</html>
