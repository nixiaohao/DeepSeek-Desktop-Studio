<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<!--
  CSP: `default-src 'none'` blocks every remote load — no images, no fonts, no
  XHR, no frames — so the page can only ever run what ships with the app.

  `script-src` needs 'unsafe-inline' because the logic lives in an inline
  <script> below. Without it Chromium blocks the inline script outright and the
  panel renders as a dead, static page: buttons that look fine and do nothing,
  with no console error the user would ever see. Keeping the script external
  was rejected as the alternative: 'self' matching for sibling file:// URLs is
  not dependable, and a script that fails to load produces the identical
  silent-dead-panel failure. The real isolation boundary here is the preload
  and contextIsolation, not this header.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline';" />
<title>面板</title>
<style>
  :root {
    --bg: #14161d;
    --bg-2: #1a1d26;
    --border: #272b36;
    --fg: #d6dae3;
    --fg-dim: #8b93a7;
    --accent: #4c8dff;
    --err: #ff6b6b;
    --out: #cfd6e4;
    --ok: #3ddc84;
    --warn: #ffb454;

    /* Type scale. Every text rule below is a multiple of --fs-scale, which the
       main process overrides (window-manager.applyUiScale) when the user picks
       a size from the 视图 menu — one variable scales the whole surface.
       The defaults sit ~2px above the old hard-coded 10/11px values, which the
       user reported as straining to read; they are calc() rather than plain px
       so the scale can be re-applied without touching 40 declarations. */
    --fs-scale: 1;
    --fs-base: calc(13.5px * var(--fs-scale));
    --fs-md: calc(13px * var(--fs-scale));
    --fs-sm: calc(12px * var(--fs-scale));
    --fs-xs: calc(11px * var(--fs-scale));
    --font-mono: "Cascadia Mono", "Consolas", "Microsoft YaHei Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-mono); font-size: var(--fs-base); line-height: 1.5;
    display: flex; flex-direction: row; user-select: none;
  }

  /* Left edge drag handle → resizes the whole panel via the main process.
     A 2px line on the right side of the resizer is always visible: the seam
     between the panel and the dsh page used to read as a dead gap, and a
     1px line in var(--border) (#272b36) on the dsh dark background had a
     brightness contrast of only ~9% — practically invisible. Using
     var(--fg-dim) (#8b93a7) raises that to ~50% so the boundary is obvious
     at a glance, and a faint accent glow makes it pop without dominating
     the layout. The full strip goes accent on hover/drag. */
  #resizer {
    width: 6px; cursor: ew-resize; flex: none;
    background: linear-gradient(to right,
      transparent 0, transparent 4px,
      var(--fg-dim) 4px, var(--fg-dim) 6px);
    box-shadow: 0 0 6px rgba(76, 141, 255, 0.22);
  }
  #resizer:hover, #resizer.dragging {
    background: var(--accent);
    box-shadow: 0 0 10px rgba(76, 141, 255, 0.45);
  }

  #app { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* ── tabs (变更审阅 | 会话概览) ── */
  #tabs {
    flex: none; display: flex; gap: 2px; padding: 4px 6px 0;
    background: var(--bg-2); border-bottom: 1px solid var(--border);
  }
  #tabs .tab {
    border: 1px solid var(--border); border-bottom: none;
    border-radius: 4px 4px 0 0; background: transparent; color: var(--fg-dim);
    padding: 4px 12px; font-size: var(--fs-md); font-family: var(--font-mono);
    cursor: pointer;
  }
  #tabs .tab.on {
    color: var(--fg); background: var(--bg);
    border-color: var(--accent);
  }

  section { display: flex; flex-direction: column; min-height: 0; }
  header {
    /* 30px, not 26px: the header text is now --fs-md (13px) and a 26px bar
       clipped the descenders of the CJK glyphs once line-height grew. */
    flex: none; height: 30px; display: flex; align-items: center; gap: 8px;
    padding: 0 8px; background: var(--bg-2); border-bottom: 1px solid var(--border);
    font-size: var(--fs-md); color: var(--fg-dim); white-space: nowrap;
  }
  header .title { color: var(--fg); font-weight: 600; }
  header .spacer { flex: 1; }
  header .hint { font-size: var(--fs-sm); opacity: .7; }

  button {
    background: #22262f; color: var(--fg); border: 1px solid var(--border);
    border-radius: 3px; padding: 2px 9px; cursor: pointer;
    font-family: var(--font-mono); font-size: var(--fs-md); line-height: 1.4;
  }
  button:hover { border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  /* ── Changes area ── */
  #changes { flex: 1 1 auto; min-height: 80px; }
  #changes.off, #overview.off { display: none; }
  #changes .body {
    flex: 1; overflow: auto; padding: 6px; color: var(--fg-dim); font-size: var(--fs-md);
    user-select: text;
  }

  /* ── Overview tab (Reasonix-style session intelligence) ── */
  #overview { flex: 1 1 auto; min-height: 80px; }
  #overview .body { flex: 1; overflow: auto; padding: 8px; user-select: text; }
  .card {
    border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 10px; margin-bottom: 8px; background: var(--bg-2);
  }
  .card .ct { font-size: var(--fs-sm); color: var(--fg-dim); margin-bottom: 6px; }
  .card .big { font-size: calc(16px * var(--fs-scale)); color: var(--fg); font-weight: 600; }
  .card .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-size: var(--fs-md); }
  .card .row .k { color: var(--fg-dim); }
  .bar {
    height: 6px; border-radius: 3px; background: #22262f;
    overflow: hidden; margin: 6px 0 4px;
  }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar i.warn { background: var(--err); }

  /* A pending approval outranks the change list: it is the only thing that
     actually blocks the agent. */
  .approval {
    border: 1px solid var(--warn); border-radius: 4px; margin-bottom: 6px;
    background: rgba(255,180,84,.07);
  }
  .approval .head {
    display: flex; align-items: center; gap: 6px; padding: 5px 7px;
    border-bottom: 1px solid var(--border);
  }
  .approval .head .tool { color: var(--warn); font-weight: 600; }
  .approval .head .spacer { flex: 1; }
  .approval .reason { padding: 4px 7px; color: var(--fg-dim); font-size: var(--fs-sm); }
  .approval .files { padding: 0 7px 4px; }
  .approval .acts { display: flex; gap: 6px; padding: 0 7px 6px; }
  .approval .acts button { flex: 1; }
  .approval .acts button.allow { border-color: var(--ok); color: var(--ok); }
  .approval .acts button.allow:hover { background: var(--ok); color: #10221a; }
  .approval .acts button.deny { border-color: var(--err); color: var(--err); }
  .approval .acts button.deny:hover { background: var(--err); color: #2a1414; }

  /* ── batch approval ──
     One row per TOOL with an allow button, plus a single reject-everything row.
     There is deliberately no "allow everything" row: batching an approval means
     "I trust this tool here", and that reasoning does not transfer across
     tools. The main process refuses a cross-tool allow regardless of what this
     page offers, so the omission is a UI promise, not the only guard. */
  .batch {
    margin: 4px 6px; padding: 5px 7px; border: 1px solid var(--border);
    border-radius: 4px; background: var(--bg-2);
  }
  .batch .btitle { color: var(--fg-dim); font-size: var(--fs-sm); margin-bottom: 5px; }
  .batch .grow { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .batch .grow:last-child { margin-bottom: 0; }
  .batch .gname {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--warn);
  }
  .batch button { flex: none; padding: 3px 10px; font-size: var(--fs-sm); }
  .batch button.allow { border-color: var(--ok); color: var(--ok); }
  .batch button.allow:hover { background: var(--ok); color: #10221a; }
  .batch button.deny { border-color: var(--err); color: var(--err); }
  .batch button.deny:hover { background: var(--err); color: #2a1414; }
  .batch .all { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--border); }
  .batch .all .gname { color: var(--fg-dim); }

  .chg { border-bottom: 1px solid var(--border); }
  .chg:last-child { border-bottom: none; }
  .chg .row {
    display: flex; align-items: center; gap: 6px; padding: 5px 6px; cursor: pointer;
  }
  .chg .row:hover { background: rgba(76,141,255,.08); }
  .chg .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; }
  .chg.pending .dot { background: var(--warn); }
  .chg.applied .dot { background: var(--ok); }
  .chg.rejected .dot { background: var(--err); }
  .chg .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chg.applied .title, .chg.rejected .title { opacity: .75; }
  .chg .delta { flex: none; font-size: var(--fs-sm); }
  .chg .delta .add { color: var(--ok); }
  .chg .delta .del { color: var(--err); }
  .chg .detail { padding: 0 6px 6px 18px; display: none; }
  .chg.open .detail { display: block; }
  .chg .detail pre {
    margin-top: 4px; padding: 4px 6px; background: #101319; border: 1px solid var(--border);
    border-radius: 3px; max-height: 200px; overflow: auto; white-space: pre-wrap;
    word-break: break-all; font-size: var(--fs-sm); color: var(--out);
  }
  .chg .detail .note { color: #5d6377; font-size: var(--fs-sm); }
  .chg .detail .tools { display: flex; gap: 6px; margin-top: 4px; }

  /* ── syntax tokens ──────────────────────────────────────────────────
     Emitted as CLASSES by src/highlight.ts, never as inline styles: the CSP
     above allows the page's own <style> but is one edit away from tightening,
     and an inline style would then silently lose all colouring.
     Colours are deliberately few — five kinds, no per-language themes —
     because this is a skim surface, not an editor. */
  .tok-k { color: #569cd6; } /* keyword */
  .tok-s { color: #ce9178; } /* string  */
  .tok-c { color: #6a9955; } /* comment */
  .tok-n { color: #b5cea8; } /* number  */
  .tok-a { color: #9cdcfe; } /* tag / attribute / key */

  .empty { color: #5d6377; padding: 8px; font-size: var(--fs-md); }

  label.chk { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-md); cursor: pointer; }
  label.chk input { margin: 0; }

  #toast {
    position: fixed; left: 8px; bottom: 8px; background: #22262f; border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 10px; font-size: var(--fs-md); display: none; z-index: 60;
    max-width: calc(100% - 16px); word-break: break-all;
  }
  #toast.err { border-color: var(--err); color: var(--err); }
</style>
</head>
<body>
  <div id="resizer" title="拖动调整面板宽度"></div>

  <div id="app">
    <div id="tabs">
      <button class="tab on" data-tab="changes">变更审阅</button>
      <button class="tab" data-tab="overview">会话概览</button>
    </div>
    <section id="changes">
      <header>
        <span class="title">变更审阅</span>
        <span class="spacer"></span>
        <span class="hint" id="chg-status">未连接</span>
      </header>
      <div class="body" id="changes-body">
        <div class="empty">等待 agent 的变更事件…</div>
      </div>
    </section>

    <section id="overview" class="off">
      <header>
        <span class="title">会话概览</span>
        <span class="spacer"></span>
        <span class="hint" id="ov-status"></span>
      </header>
      <div class="body" id="overview-body">
        <div class="empty">等待 agent 的用量数据…</div>
      </div>
    </section>
  </div>


  <div id="toast"></div>

<script>
(function () {
  'use strict';
  var api = window.dshPanel;
  if (!api) {
    // The bridge is dead, which means panel-preload.js threw before it reached
    // contextBridge.exposeInMainWorld — a failed top-level require is the usual
    // cause (Electron 22+ sandboxes preloads by default, so requires of files
    // inside app.asar are rejected; window-manager.ts opts the overlays out).
    //
    // Nothing in THIS file can report the reason: the script that would have
    // reported it is the one that failed. window-manager.ts listens for
    // `preload-error` / `render-process-gone` and writes the real reason to
    // launcher.log, so point the user straight at it instead of leaving a dead
    // string on screen (which cost a whole round-trip on 2026-09-01).
    document.getElementById('changes-body').innerHTML =
      '<div class="empty">面板桥接不可用（preload 未加载）。<br><br>' +
      '主进程已把真实原因写入日志：<br>' +
      '<code>%APPDATA%\\deepseek-studio\\logs\\launcher.log</code><br><br>' +
      '搜索 <code>preload-error</code> 或 <code>renderer-gone</code>。</div>';
    return;
  }

  // ── change review (dsh mux stream) ─────────────────────────────────────

  var changesBody = document.getElementById('changes-body');
  var chgStatus = document.getElementById('chg-status');
  var PREVIEW_LINES = 100;
  var chgTimer = null;

  var toastTimer = null;
  function toast(msg, isErr) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isErr ? 'err' : '';
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 4000);
  }

  /**
   * Cheap +/- count from a bag-of-lines comparison.
   *
   * Not a real diff: FileDiff carries whole file bodies, and an LCS over a
   * 5k-line file is not worth it for a header badge. Order-insensitive, so a
   * pure reorder reads as no change — acceptable for "how big is this".
   */
  function deltaOf(d) {
    var newLines = String(d && d.newText ? d.newText : '').split('\n');
    if (!d || d.oldText === null || d.oldText === undefined) {
      return { add: newLines.length, del: 0 };
    }
    var bag = {};
    var oldLines = String(d.oldText).split('\n');
    for (var i = 0; i < oldLines.length; i++) {
      bag[oldLines[i]] = (bag[oldLines[i]] || 0) + 1;
    }
    var add = 0;
    for (var j = 0; j < newLines.length; j++) {
      if (bag[newLines[j]] > 0) bag[newLines[j]] -= 1;
      else add += 1;
    }
    var del = 0;
    for (var k in bag) { if (Object.prototype.hasOwnProperty.call(bag, k)) del += bag[k]; }
    return { add: add, del: del };
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  /**
   * Syntax-highlight a fragment, degrading to escaped plain text.
   *
   * try/catch is not defensive decoration: `api` is installed by the preload,
   * which is versioned with the app and not with this HTML, and this runs
   * inside a render loop — a throw here leaves the user looking at a half-built
   * panel with no way to tell what happened.
   *
   * The fallback escapes through a detached node rather than a hand-rolled
   * .replace() chain: there is exactly one HTML escaper worth having and it
   * lives in src/highlight.ts.
   */
  function hl(code, filePath) {
    try {
      var out = api.highlight(code, filePath);
      if (typeof out === 'string' && out) return out;
    } catch (e) { /* bridge missing or older than this page */ }
    var n = document.createElement('div');
    n.textContent = code;
    return n.innerHTML;
  }

  /** Build one change card. Paths are real, so they stay clickable. */
  function changeNode(c) {
    var wrap = el('div', 'chg ' + c.status);

    var row = el('div', 'row');
    row.appendChild(el('span', 'dot'));
    row.appendChild(el('span', 'title', c.title || c.toolName || '变更'));

    var add = 0;
    var del = 0;
    for (var i = 0; i < c.diffs.length; i++) {
      var d = deltaOf(c.diffs[i]);
      add += d.add;
      del += d.del;
    }
    var delta = el('span', 'delta');
    delta.appendChild(el('span', 'add', '+' + add));
    delta.appendChild(document.createTextNode(' '));
    delta.appendChild(el('span', 'del', '-' + del));
    row.appendChild(delta);
    wrap.appendChild(row);

    var detail = el('div', 'detail');
    for (var f = 0; f < c.diffs.length; f++) {
      var diff = c.diffs[f];
      var head = el('div', '', diff.path);
      head.style.color = 'var(--accent)';
      head.style.cursor = 'pointer';
      head.title = '用外部编辑器打开';
      /* eslint-disable no-loop-func */
      (function (p) {
        head.onclick = function (ev) {
          ev.stopPropagation();
          api.openInEditor(p).then(function (r) {
            if (r && !r.ok) toast('打开失败：' + (r.error || '未知错误'), true);
          });
        };
      })(diff.path);
      detail.appendChild(head);

      var body = diff.oldText === null || diff.oldText === undefined
        ? String(diff.newText || '')
        : String(diff.newText || '');
      var lines = body.split('\n');
      var shown = lines.slice(0, PREVIEW_LINES).join('\n');
      // innerHTML, not textContent — hl() returns an escaped HTML fragment, and
      // the CSP's script-src stops anything executable even if it were not.
      // Highlighted as ONE blob rather than line by line, so a block comment or
      // a triple-quoted string that spans the preview is coloured as a whole.
      var pre = el('pre');
      pre.innerHTML = hl(shown, diff.path);
      detail.appendChild(pre);
      if (lines.length > PREVIEW_LINES) {
        detail.appendChild(el('div', 'note',
          '（预览已截断，共 ' + lines.length + ' 行；完整内容请在编辑器中查看）'));
      }
      if (diff.oldText === null || diff.oldText === undefined) {
        detail.appendChild(el('div', 'note', '新建文件'));
      }
    }
    wrap.appendChild(detail);

    row.onclick = function () {
      wrap.classList.toggle('open');
    };
    return wrap;
  }

  /** Build one approval card, joining back to the call it is asking about. */
  function approvalNode(a, changes) {
    var wrap = el('div', 'approval');

    var head = el('div', 'head');
    head.appendChild(el('span', 'tool', a.toolName || '工具'));
    head.appendChild(el('span', '', '请求授权'));
    head.appendChild(el('span', 'spacer'));
    head.appendChild(el('span', 'note', new Date(a.ts).toLocaleTimeString()));
    wrap.appendChild(head);

    if (a.reason) wrap.appendChild(el('div', 'reason', a.reason));

    // The approval frame carries no diff — the callId is the only way back to
    // "what exactly is it asking to write", so look the call up here.
    var related = null;
    if (a.callId) {
      for (var i = 0; i < changes.length; i++) {
        if (changes[i].callId === a.callId) { related = changes[i]; break; }
      }
    }

    var files = el('div', 'files');
    if (related && related.diffs.length) {
      for (var f = 0; f < related.diffs.length; f++) {
        files.appendChild(el('div', '', related.diffs[f].path));
      }
    } else {
      files.appendChild(el('div', 'note', '（该调用未提供文件差异）'));
    }
    wrap.appendChild(files);

    var acts = el('div', 'acts');
    var allow = el('button', 'allow', '允许一次');
    var deny = el('button', 'deny', '拒绝');

    function answer(outcome) {
      allow.disabled = true;
      deny.disabled = true;
      api.respondApproval(a.approvalId, outcome).then(function (r) {
        if (r && !r.ok) {
          allow.disabled = false;
          deny.disabled = false;
          toast('审批失败：' + (r.error || '未知错误'), true);
        } else {
          toast(outcome === 'rejected' ? '已拒绝' : '已允许');
        }
      });
    }
    allow.onclick = function (e) { e.stopPropagation(); answer('allowed-once'); };
    deny.onclick = function (e) { e.stopPropagation(); answer('rejected'); };
    acts.appendChild(allow);
    acts.appendChild(deny);
    wrap.appendChild(acts);
    return wrap;
  }

  /** How many ids a failure toast lists before it starts eliding. */
  var FAIL_IDS_SHOWN = 3;

  /**
   * Answer a batch and report what actually happened.
   *
   * The report is per-bucket rather than a single success flag: "3 of 5" says
   * nothing about WHICH two failed, and with a shell command in the batch the
   * user needs to know whether that one landed.
   *
   * `skipped` is reported separately from `failed` and without an error tone —
   * those approvals were resolved by the agent itself between render and click.
   */
  function batchAnswer(ids, outcome, buttons) {
    if (!ids.length) return;
    for (var b = 0; b < buttons.length; b++) buttons[b].disabled = true;

    /**
     * Always re-enabled, and always followed by a re-render.
     *
     * Leaving them disabled "until the list refreshes" sounds tidier and is a
     * trap: if the backend never pushes an update the bar stays greyed out
     * forever with no way to retry. The cost of re-enabling is a possible
     * double-click on a stale row, and that degrades harmlessly — the approval
     * is gone from the store, so it comes back in `skipped`, not `failed`.
     */
    function release() {
      for (var i = 0; i < buttons.length; i++) buttons[i].disabled = false;
      scheduleChanges();
    }

    api.respondMany(ids, outcome).then(function (r) {
      if (!r || r.error) {
        toast('批量操作失败：' + ((r && r.error) || '未知错误'), true);
        release();
        return;
      }
      var parts = [];
      if (r.answered) parts.push('已处理 ' + r.answered + ' 个');
      if (r.failed.length) {
        var names = r.failed.map(function (f) { return f.approvalId; });
        var shown = names.slice(0, FAIL_IDS_SHOWN).join(', ');
        if (names.length > FAIL_IDS_SHOWN) shown += ' 等 ' + names.length + ' 个';
        parts.push('失败 ' + names.length + ' 个：' + shown + '（' + r.failed[0].error + '）');
      }
      // No error tone on this one: the agent resolved those itself.
      if (r.skipped.length) parts.push(r.skipped.length + ' 个已被 agent 自行处理');
      toast(parts.join('，') || '没有可处理的审批', r.failed.length > 0);
      release();
    }).catch(function (e) {
      toast('批量操作失败：' + String((e && e.message) || e), true);
      release();
    });
  }

  /**
   * The batch bar, shown only when there is more than one pending approval.
   *
   * With exactly one, the card's own 允许/拒绝 buttons already are the batch —
   * a "batch of one" row above it is just noise.
   */
  function batchNode(approvals) {
    var groups = api.groupApprovals(approvals);
    var wrap = el('div', 'batch');
    wrap.appendChild(el('div', 'btitle',
      '批量审批 · 共 ' + approvals.length + ' 个待处理（允许按工具分组，拒绝不受限制）'));

    for (var i = 0; i < groups.length; i++) {
      (function (group) {
        var row = el('div', 'grow');
        var n = group.approvalIds.length;
        row.appendChild(el('span', 'gname', group.toolName + ' × ' + n));

        var allow = el('button', 'allow', n > 1 ? ('允许这 ' + n + ' 个') : '允许');
        var deny = el('button', 'deny', n > 1 ? ('拒绝这 ' + n + ' 个') : '拒绝');
        allow.onclick = function () { batchAnswer(group.approvalIds, 'allowed-once', [allow, deny]); };
        deny.onclick = function () { batchAnswer(group.approvalIds, 'rejected', [allow, deny]); };
        row.appendChild(allow);
        row.appendChild(deny);
        wrap.appendChild(row);
      })(groups[i]);
    }

    // Reject-everything is safe to offer globally: refusing work cannot cause
    // damage. The mirror-image button (allow everything) is deliberately absent.
    if (approvals.length > 1) {
      var all = el('div', 'grow all');
      all.appendChild(el('span', 'gname', '全部 ' + approvals.length + ' 个'));
      var denyAll = el('button', 'deny', '全部拒绝');
      var ids = approvals.map(function (a) { return a.approvalId; });
      denyAll.onclick = function () { batchAnswer(ids, 'rejected', [denyAll]); };
      all.appendChild(denyAll);
      wrap.appendChild(all);
    }

    return wrap;
  }

  function renderChanges(snap) {
    if (!snap) return;
    var changes = snap.changes || [];
    var approvals = snap.approvals || [];

    chgStatus.textContent = snap.connected
      ? '已连接 · ' + changes.length + ' 项变更'
      : '未连接（变更流未建立）';

    changesBody.textContent = '';

    if (!approvals.length && !changes.length) {
      changesBody.appendChild(el('div', 'empty', snap.connected
        ? '暂无变更。agent 修改文件时会出现在这里。'
        : '尚未连接到 dsh 事件流。运行监控不受影响。'));
      return;
    }

    if (approvals.length > 1) changesBody.appendChild(batchNode(approvals));
    for (var i = 0; i < approvals.length; i++) {
      changesBody.appendChild(approvalNode(approvals[i], changes));
    }
    for (var j = 0; j < changes.length; j++) {
      changesBody.appendChild(changeNode(changes[j]));
    }
  }

  /** Pull on a throttle: the main process pushes only a revision bump. */
  function scheduleChanges() {
    if (chgTimer !== null) return;
    chgTimer = setTimeout(function () {
      chgTimer = null;
      api.getChanges().then(renderChanges).catch(function () { /* stream not up */ });
      // The overview reads the same projections the rev bump just announced;
      // piggybacking here keeps one throttle instead of one per tab.
      pullOverview();
    }, 120);
  }

  api.onChangesChanged(scheduleChanges);
  scheduleChanges();

  // ── tabs (变更审阅 | 会话概览) ─────────────────────────────────────────

  var tabsEl = document.getElementById('tabs');
  tabsEl.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('.tab') : null;
    if (!t) return;
    var id = t.dataset.tab;
    for (var i = 0; i < tabsEl.children.length; i++) {
      tabsEl.children[i].classList.toggle('on', tabsEl.children[i] === t);
    }
    document.getElementById('changes').classList.toggle('off', id !== 'changes');
    document.getElementById('overview').classList.toggle('off', id !== 'overview');
    if (id === 'overview') pullOverview();
  });

  // ── session overview (Reasonix-style intelligence) ─────────────────────

  function fmtTok(n) {
    if (typeof n !== 'number' || !Number.isFinite(n) || n <= 0) return '0';
    if (n < 1000) return String(Math.round(n));
    if (n < 1000000) {
      var k = n / 1000;
      return (k >= 100 ? Math.round(k) : Math.round(k * 10) / 10) + 'k';
    }
    return Math.round((n / 1000000) * 10) / 10 + 'M';
  }

  function barRow(percent, warn) {
    var bar = el('div', 'bar');
    var fill = el('i');
    fill.style.width = Math.max(0, Math.min(100, percent)) + '%';
    if (warn) fill.className = 'warn';
    bar.appendChild(fill);
    return bar;
  }

  function kvRow(k, v) {
    var row = el('div', 'row');
    row.appendChild(el('span', 'k', k));
    row.appendChild(el('span', 'v', v));
    return row;
  }

  function renderOverview(o) {
    var body = document.getElementById('overview-body');
    if (!o || typeof o !== 'object') return;
    var t = o.tokens || {};
    var nothing = !o.contextUsed && !t.uncachedInput && !t.output && !t.cacheRead && !t.cacheWrite;
    body.textContent = '';

    if (nothing) {
      body.appendChild(el('div', 'empty', '暂无用量数据。agent 跑起来后这里会出现上下文与 token 构成。'));
      return;
    }

    // 上下文占用（pressureTokens，缺省退化 surfaceTokens；窗口未知时不画百分比）
    var ctx = el('div', 'card');
    ctx.appendChild(el('div', 'ct', '上下文'));
    var ctxText = fmtTok(o.contextUsed);
    if (o.contextWindow !== null && o.contextWindow !== undefined) {
      ctxText += ' / ' + fmtTok(o.contextWindow);
    }
    ctx.appendChild(el('div', 'big', ctxText));
    if (o.contextPercent !== null && o.contextPercent !== undefined) {
      ctx.appendChild(barRow(o.contextPercent, o.contextPercent >= 80));
    }
    body.appendChild(ctx);

    // 缓存命中率
    var hit = el('div', 'card');
    hit.appendChild(el('div', 'ct', '缓存命中率'));
    if (o.hitRate === null || o.hitRate === undefined) {
      hit.appendChild(el('div', 'big', '–'));
    } else {
      hit.appendChild(el('div', 'big', o.hitRate + '%'));
      hit.appendChild(barRow(o.hitRate, false));
    }
    body.appendChild(hit);

    // Token 构成
    var tk = el('div', 'card');
    tk.appendChild(el('div', 'ct', 'Token 构成'));
    tk.appendChild(kvRow('输入（未命中）', fmtTok(t.uncachedInput)));
    tk.appendChild(kvRow('输入（缓存命中）', fmtTok(t.cacheRead)));
    tk.appendChild(kvRow('缓存写入', fmtTok(t.cacheWrite)));
    tk.appendChild(kvRow('输出', fmtTok(t.output)));
    body.appendChild(tk);

    // 上下文构成（system / tools / messages）
    if (o.breakdown) {
      var bd = el('div', 'card');
      bd.appendChild(el('div', 'ct', '上下文构成'));
      bd.appendChild(kvRow('系统提示', fmtTok(o.breakdown.system)));
      bd.appendChild(kvRow('工具定义', fmtTok(o.breakdown.tools)));
      bd.appendChild(kvRow('对话消息', fmtTok(o.breakdown.messages)));
      body.appendChild(bd);
    }
  }

  function pullOverview() {
    if (!api.getOverview) return;
    api.getOverview().then(renderOverview).catch(function () { /* stream not up */ });
  }

  // ── resizer (panel width, handled by the main process) ─────────────────

  var resizer = document.getElementById('resizer');
  resizer.addEventListener('mousedown', function (e) {
    e.preventDefault();
    resizer.classList.add('dragging');
    var startX = e.clientX;

    function onMove(ev) {
      // Dragging left widens the panel; report the desired total width.
      api.setPanelWidth(window.innerWidth + (startX - ev.clientX));
    }
    function onUp() {
      resizer.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // ── restore saved geometry ─────────────────────────────────────────────

  api.getPrefs().then(function (p) {
    if (p && typeof p.panelWidth === 'number') {
      // The main process clamps; this only nudges the first paint.
      api.setPanelWidth(p.panelWidth);
    }
  }).catch(function () { /* defaults are fine */ });
})();
</script>
</body>
</html>
